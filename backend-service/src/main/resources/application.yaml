server:
  port: 8080
  servlet:
    context-path: /pharmacy
spring:
  application:
    name: pharmacy-service
  datasource:
    #        lay bien do neu khong co thi se lay default la phia sau dau :
    #        172.17.0.2 la ip cua container mysql khi chay docker
    url: ${DBMS_CONNECTION:jdbc:mysql://localhost:3306/pharmacy_service}
    username: ${DBMS_USERNAME:root}
    password: ${DBMS_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 5000ms
#Goole OAuth2
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 30MB

jwt:
  signerKey: ${JWT_SECRET}
  valid-duration: 20000 # in second
  refreshable-duration: 120000 # in seconds
outbound:
  google:
    client-id: ${GOOGLE_CLIENT_ID}
vnpay:
  tmn-code: ${VNPAY_TMN_CODE}
  hash-secret: ${VNPAY_HASH_SECRET}
  pay-url: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
  return-url: http://localhost:8080/pharmacy/payments/vnpay-return
  ipn-url: http://localhost:8080/pharmacy/payments/vnpay-ipn
  api-url: https://sandbox.vnpayment.vn/merchant_webapi/api/transaction
